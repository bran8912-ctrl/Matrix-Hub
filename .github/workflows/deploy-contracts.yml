name: Smart Contract Deployment

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        type: choice
        options:
          - 'sepolia'
          - 'mainnet'
      contract:
        description: 'Contract to deploy'
        required: true
        type: choice
        options:
          - 'mtx'
          - 'casino'
      confirm:
        description: 'Type "DEPLOY" to confirm (required for mainnet)'
        required: true
        type: string

jobs:
  validate-deployment:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.network }}" == "mainnet" ] && [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Mainnet deployment requires confirmation" >> $GITHUB_STEP_SUMMARY
            echo "Please type 'DEPLOY' in the confirmation field" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "✅ Deployment request validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Network:** ${{ inputs.network }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Contract:** ${{ inputs.contract }}" >> $GITHUB_STEP_SUMMARY

  compile-contracts:
    name: Compile Contracts
    runs-on: ubuntu-latest
    needs: validate-deployment
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Compile contracts
        run: |
          echo "## 🔨 Compiling Smart Contracts" >> $GITHUB_STEP_SUMMARY
          npm run compile
          echo "✅ Compilation successful" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contracts
          path: |
            artifacts/
            cache/
          retention-days: 7

  deploy-info:
    name: Deployment Information
    runs-on: ubuntu-latest
    needs: [validate-deployment, compile-contracts]
    
    steps:
      - name: Display deployment info
        run: |
          echo "## 📋 Deployment Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **IMPORTANT:** This is a manual deployment workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To complete the deployment, you need to:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Set up deployment secrets in repository settings:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`PRIVATE_KEY\`: Deployer wallet private key" >> $GITHUB_STEP_SUMMARY
          echo "   - \`INFURA_API_KEY\` or \`ALCHEMY_API_KEY\`: RPC provider key" >> $GITHUB_STEP_SUMMARY
          echo "   - \`ETHERSCAN_API_KEY\`: For contract verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. Update \`hardhat.config.js\` with network configurations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3. Run the deployment script:" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   npm run deploy:${{ inputs.network }}:${{ inputs.contract }}" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Notice" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Never commit private keys to the repository" >> $GITHUB_STEP_SUMMARY
          echo "- Always verify contract addresses after deployment" >> $GITHUB_STEP_SUMMARY
          echo "- For mainnet deployments, use a hardware wallet or secure key management" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Requested Deployment:**" >> $GITHUB_STEP_SUMMARY
          echo "- Network: ${{ inputs.network }}" >> $GITHUB_STEP_SUMMARY
          echo "- Contract: ${{ inputs.contract }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
